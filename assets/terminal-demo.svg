<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="272" viewBox="0 0 1080 272" role="img" aria-labelledby="title desc">
  <title id="title">Shell Buddy</title>
  <desc id="desc">A terminal example: create file hello.txt, with touch './hello.txt' shown on the following line.</desc>
  <rect width="1080" height="272" rx="8" fill="#0D1319"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25">
    <text x="60" y="78" fill="#86949F">~/projects</text>
    <text x="60" y="134" fill="#2DD4BF">❯</text>
    <text x="98" y="134" fill="#2DD4BF">✦</text>
    <text x="136" y="134" fill="#F0F4F7">create file hello.txt</text>
    <text x="98" y="184" fill="#8D9AA5">touch './hello.txt'</text>
  </g>
</svg>
