name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install zsh and plugin test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh zsh-autosuggestions zsh-syntax-highlighting
      - name: Verify custom font assets
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r tools/font-requirements.txt
          python tests/fonts.py
      - run: zig build test
      - run: zig build -Doptimize=small
      - run: python tests/integration.py
      - run: zig build build-update-tests -Doptimize=small
      - run: python tests/update.py
      - run: python tests/release.py
      - name: Windows ConPTY dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install pywinpty
          Install-Module PSReadLine -MinimumVersion 2.3.6 -Scope CurrentUser -Force
      - name: Windows native PowerShell interaction
        if: runner.os == 'Windows'
        run: python tests/windows_terminal.py
      - run: python tests/benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: shell-buddy-${{ runner.os }}
          path: zig-out/bin/*
