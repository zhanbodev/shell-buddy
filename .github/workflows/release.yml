name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
            target: x86_64-linux-musl
          - runner: macos-15
            platform: macos
            architecture: aarch64
            target: aarch64-macos
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
            target: x86_64-macos
          - runner: windows-latest
            platform: windows
            architecture: x86_64
            target: x86_64-windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux terminal dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh zsh-autosuggestions zsh-syntax-highlighting
      - name: Font dependencies
        run: python -m pip install -r tools/font-requirements.txt
      - run: python tests/fonts.py
      - run: zig build test
      - run: zig build -Doptimize=small -Dtarget=${{ matrix.target }}
      - run: python tests/integration.py
      - run: python tests/benchmark.py
      - run: python tests/release.py
      - name: Windows interaction dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install pywinpty
          Install-Module PSReadLine -MinimumVersion 2.3.6 -Scope CurrentUser -Force
      - name: Windows native interaction
        if: runner.os == 'Windows'
        run: python tests/windows_terminal.py
      - name: Package tested native binary
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          binary = pathlib.Path('zig-out/bin/shell-buddy' + ('.exe' if os.name == 'nt' else ''))
          version = subprocess.check_output([str(binary.resolve()), '--version'], text=True).strip()
          tag = os.environ['GITHUB_REF_NAME']
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and tag != 'v' + version:
              raise SystemExit('Tag does not match binary version: ' + version)
          subprocess.run(['python', 'tools/package_release.py', '--binary', str(binary), '--platform', os.environ['RELEASE_PLATFORM'], '--architecture', os.environ['RELEASE_ARCHITECTURE'], '--version', version], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: release-*
      - run: python tools/package_release.py --output dist --checksums-only
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --verify-tag --draft --title "Shell Buddy $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
